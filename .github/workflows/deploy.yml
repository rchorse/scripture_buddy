name: Deploy

# Manual-only until the AWS_DEPLOY_ROLE_ARN secret exists (needs an IAM OIDC
# provider + deploy role). Re-enable the push trigger once it's configured.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g aws-cdk

      - name: CDK deploy
        working-directory: infra
        run: |
          pip install -r requirements.txt
          cdk deploy ScriptureBuddyAuth ScriptureBuddyApi ScriptureBuddyJobs ScriptureBuddyWeb \
            --require-approval never

      - name: Run migrations
        run: |
          aws lambda invoke --function-name scripturebuddy-api \
            --cli-binary-format raw-in-base64-out \
            --payload '{"task":"migrate"}' migrate-out.json
          cat migrate-out.json
          grep -q '"status": "ok"' migrate-out.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build and publish web
        working-directory: app
        run: |
          # All three are required. USER_POOL_ID and USER_POOL_CLIENT_ID have no
          # defaults in AppConfig, and an empty clientId fails at sign-in with
          # InvalidParameterException rather than at build time.
          test -n "${{ vars.API_URL }}" || { echo "API_URL var is unset"; exit 1; }
          test -n "${{ vars.USER_POOL_ID }}" || { echo "USER_POOL_ID var is unset"; exit 1; }
          test -n "${{ vars.USER_POOL_CLIENT_ID }}" || { echo "USER_POOL_CLIENT_ID var is unset"; exit 1; }
          flutter build web --release \
            --dart-define=API_URL=${{ vars.API_URL }} \
            --dart-define=USER_POOL_ID=${{ vars.USER_POOL_ID }} \
            --dart-define=USER_POOL_CLIENT_ID=${{ vars.USER_POOL_CLIENT_ID }}
          BUCKET=$(aws cloudformation describe-stacks --stack-name ScriptureBuddyWeb \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          DIST_ID=$(aws cloudformation describe-stacks --stack-name ScriptureBuddyWeb \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          # Entry points must revalidate: main.dart.js is not content-hashed, so
          # without this browsers heuristically cache a stale app and a
          # CloudFront invalidation cannot reach them.
          aws s3 sync build/web "s3://$BUCKET" --delete \
            --cache-control "no-cache, must-revalidate" --exclude "canvaskit/*"
          aws s3 sync build/web/canvaskit "s3://$BUCKET/canvaskit" \
            --delete --cache-control "public, max-age=2592000"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
