<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ScriptureBuddy Admin{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    :root { --green: #2e7d32; --bg: #f6f8f4; --card: #ffffff; --ink: #1c231b; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
    header { background: var(--green); color: white; padding: 0.7rem 1.2rem; display: flex; gap: 1.4rem; align-items: center; }
    header a { color: white; text-decoration: none; font-weight: 600; }
    main { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
    .card { background: var(--card); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
    button, .btn { background: var(--green); border: none; color: white; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none; display: inline-block; }
    button.secondary { background: #777; }
    button.danger { background: #b3261e; }
    textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #e4e8e1; }
    .pill { border-radius: 999px; padding: 0.1rem 0.6rem; font-size: 0.78rem; color: white; }
    .pill.ai_draft { background: #8a6d00; } .pill.approved { background: var(--green); }
    .pill.rejected { background: #b3261e; } .pill.in_review { background: #315da8; }
    .pill.retired { background: #777; }
  </style>
</head>
<body>
<header>
  <span>📖 ScriptureBuddy Admin</span>
  <a href="{{ base }}/admin">Dashboard</a>
  <a href="{{ base }}/admin/works">Works</a>
  <a href="{{ base }}/admin/review">Review queue</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
