{% extends "base.html" %}
{% block title %}Sign in — Admin{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 4rem auto;">
  <h2>Owner sign-in</h2>
  {% if error %}<p style="color:#b3261e">{{ error }}</p>{% endif %}
  <form method="post" action="{{ base }}/admin/login">
    <p><input name="username" placeholder="Username" style="width:100%;padding:.5rem"></p>
    <p><input name="password" type="password" placeholder="Password" style="width:100%;padding:.5rem"></p>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
